# 部署到 GitHub Pages。
#
# 域名：CNAME 里写的是 gdp.newzone.top，但**DNS 上还没有这条记录**（2026-10-28 查过）。
# 所以当前实际域名是 https://rockbenben.github.io/gdp-map/ ——index.html 的
# canonical / OG、README 的入口、package.json 的 homepage 都指着它。
# DNS 加上 CNAME 记录之后自定义域名会接管，那些地方一起换回去即可。
#
# ── 版本钉法（与 ci.yml 同一套规矩）──
#
# action 钉在大版本标签上，不钉 commit SHA：这几个都是第一方 `actions/*`，
# 钉死 SHA 换来的那点供应链收益，代价是每次升级都要手动改哈希。
# 升大版本时改这里的标签号（checkout v7 → v8、setup-node v7 → v8 之类），
# 并顺手核一遍是不是最新主版本。
# node 钉在 LTS 线（'24'）：写范围等于把 CI 交给未来的自己，
# 而且要和本地跑的那条线一致——本机装的是什么版本，CI 就跑什么版本。
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
