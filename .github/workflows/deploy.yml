# 部署：构建产物推到 gh-pages 分支，EdgeOne Pages 从那个分支取。
#
# 跟兄弟项目同一个模式（022-onepage / 002-legend-talk / 025-kuafu / 039-text2handwriting）：
#   · 构建产物推到 gh-pages 分支
#   · EdgeOne Pages 的 Git 集成指向这个仓的这个分支
#   · 缓存与安全响应头由 public/edgeone.json 决定
#   · 自定义域名在 EdgeOne 那侧绑，DNS 加一条 CNAME 指过去
#
# ⚠️ **CNAME 要跟着分支走**：EdgeOne 是从分支里的 CNAME 文件认出「这个分支该绑哪个域名」的，
#    每次部署覆盖分支时如果没带上，绑定就掉了（002-legend-talk 的注释记的就是这件事）。
#    所以 CNAME 由下面的 cname: 参数写进分支，不再放在 public/ 里。
#
# ⚠️ **不转发 head commit message**：任意提交正文里的 shell 元字符（引号、$、!、反引号）
#    会破坏动作内部的 git commit -m 调用（exit 129）——025-kuafu / 039 都记了这条。
#    动作默认的静态提交信息足矣，规范历史保留在 main。
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# 同一分支连推两次时取消上一次，别排队跑一堆注定要覆盖的构建
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 推分支要写权限（CI 那个 job 只读，这里要写）
permissions:
  contents: write

jobs:
  deploy:
    name: Build & push to gh-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # 获取完整历史，供部署动作生成稳定提交
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # 部署前先跑测试作为门禁，坏构建不发布（npm run build 里已经含 tsc --noEmit）
      - run: npm test

      - run: npm run build

      - name: Push to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          clean: true # 每次先清空分支，别让旧文件留在上面
          cname: gdp.newzone.top
